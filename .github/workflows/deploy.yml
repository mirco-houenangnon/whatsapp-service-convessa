name: 🚀 Deploy Backend — VPS

on:
  push:
    branches: [ diegue ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📡 Connect & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 40m
          script: |
            set -e
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Deploy Backend — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /var/www/convessa/backend

            echo "📥 Pull branch diegue..."
            git fetch origin
            git checkout diegue
            git reset --hard origin/diegue

            echo "🐳 Rebuild & restart backend container..."
            cd /var/www/convessa
            DOCKER_BUILDKIT=1 docker compose up -d --build backend

            echo "🩺 Health check..."
            sleep 8
            if docker inspect convessa_backend | grep -q '"Running": true'; then
              echo "✅ Backend opérationnel !"
            else
              echo "❌ Backend en échec — voir logs :"
              docker logs convessa_backend --tail 30
              exit 1
            fi
