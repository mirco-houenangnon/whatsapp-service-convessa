name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.BACKEND_PATH || '~/www/whatsapp-service-convessa' }}

            echo "Pull latest code..."
            git pull origin main

            echo "Install dependencies..."
            npm ci --omit=dev --ignore-scripts

            echo "Build TypeScript..."
            npm run build

            echo "Restart service..."
            # Si PM2 est installé
            if command -v pm2 &> /dev/null; then
              pm2 restart convessa-backend --update-env || pm2 start dist/index.js --name convessa-backend
            # Sinon via systemctl
            elif systemctl is-active --quiet convessa-backend; then
              systemctl restart convessa-backend
            else
              echo "Redémarrage manuel requis"
            fi

            echo "Backend déployé avec succès !"
